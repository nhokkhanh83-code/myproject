{% extends 'base.html' %}

{% block content %}
<div class="col-sm-9 padding-right">
    <div class="login-form"><!--login form-->
        <h2>Login to your account</h2>

        <!-- Hiển thị thông báo nếu nhập sai tài khoản/mật khẩu -->
        {% if form.errors %}
            <p style="color: red;">Tên đăng nhập hoặc mật khẩu không chính xác!</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <span>
                <input type="checkbox" class="checkbox"> 
                Keep me signed in
            </span>
            <button type="submit" class="btn btn-default">Login</button>

            <div style="margin-top: 15px;">
                <span>Chưa có tài khoản? <a href="{% url 'register' %}" style="color: #FE980F; font-weight: bold;">Đăng ký ngay</a></span>
                <span style="margin: 0 10px; color: #ccc;">|</span>
                <a href="/forgot-password/" style="color: #696763; text-decoration: underline;">Quên mật khẩu?</a>
            </div>
        </form>
    </div><!--/login form-->
</div>
{% endblock %}
