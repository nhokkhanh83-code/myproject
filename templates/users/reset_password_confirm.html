{% extends "base.html" %}
{% block content %}
<div class="col-sm-9 padding-right">
    <div class="login-form">
        <h2>Đặt lại mật khẩu mới</h2>

        {% if error %}
            <p style="color: red; font-weight: bold;">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p style="color: green; font-weight: bold;">{{ success }}</p>
            <a href="{% url 'user_login' %}" class="btn btn-default" style="margin-top: 15px;">Đến trang Đăng nhập</a>
        {% else %}
            <form method="POST">
                {% csrf_token %}
                <input type="password" name="new_password" placeholder="Mật khẩu mới" required />
                <input type="password" name="confirm_password" placeholder="Xác nhận mật khẩu mới" required />
                <button type="submit" class="btn btn-default">Đổi mật khẩu</button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
