{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="col-sm-9">
    <div class="blog-post-area">
        <h2 class="title text-center" style="color: #FE980F;">Product</h2>
        <div class="signup-form">
            <h2>Edit product!</h2>

            <form id="editProductAjax" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Name -->
                <input type="text" name="name" id="name" value="{{ product.name }}" placeholder="Name" />
                <p id="error-name" style="color: red; margin-top: -5px; margin-bottom: 8px; font-size: 13px;"></p>
                
                <!-- Price -->
                <input type="number" step="0.01" name="price" id="price" value="{{ product.price }}" placeholder="Price" />
                <p id="error-price" style="color: red; margin-top: -5px; margin-bottom: 8px; font-size: 13px;"></p>
                
                <!-- Category -->
                <select name="category" id="category" style="margin-bottom: 5px; height: 40px; padding-left: 10px; border: 1px solid #F0F0E9; background: #F0F0E9; width: 100%;">
                    <option value="">Please choose category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
                <p id="error-category" style="color: red; margin-top: 0; margin-bottom: 8px; font-size: 13px;"></p>

                <!-- Brand -->
                <select name="brand" id="brand" style="margin-bottom: 5px; height: 40px; padding-left: 10px; border: 1px solid #F0F0E9; background: #F0F0E9; width: 100%;">
                    <option value="">Please choose brand</option>
                    {% for br in brands %}
                        <option value="{{ br.id }}" {% if product.brand.id == br.id %}selected{% endif %}>{{ br.name }}</option>
                    {% endfor %}
                </select>
                <p id="error-brand" style="color: red; margin-top: 0; margin-bottom: 8px; font-size: 13px;"></p>

                <!-- Status (0: New, 1: Sale) -->
                <select id="status_select" name="status" style="margin-bottom: 10px; height: 40px; padding-left: 10px; border: 1px solid #F0F0E9; background: #F0F0E9; width: 100%;">
                    <option value="0" {% if product.status == 0 %}selected{% endif %}>New</option>
                    <option value="1" {% if product.status == 1 %}selected{% endif %}>Sale</option>
                </select>

                <!-- Ô nhập % Sale -->
               <div id="sale_box" {% if product.status != 1 %}style="display: none; margin-bottom: 10px;"{% else %}style="margin-bottom: 10px;"{% endif %}>
                    <div style="display: flex; align-items: center; width: 200px;">
                        <input type="number" min="0" max="100" name="sale_price" id="sale_price" value="{{ product.sale|default:'0' }}" style="margin-bottom: 0; width: 100px; display: inline-block;" />
                        <span style="margin-left: 10px; font-weight: bold; font-size: 16px;">%</span>
                    </div>
                </div>

                <!-- Company profile -->
                <input type="text" name="company" value="{{ product.company|default:'' }}" placeholder="Company profile" />

                <!-- Upload File Mới -->
                <input type="file" name="images" id="images" multiple accept="image/*" style="margin-bottom: 5px;" />
                <p id="error-images" style="color: red; margin-top: 0; margin-bottom: 8px; font-size: 13px;"></p>

                <!-- Vùng hiển thị ảnh cũ kèm Checkbox đánh dấu xóa theo đề bài -->
                {% if old_images %}
                <div style="display: flex; gap: 20px; margin-bottom: 15px; margin-top: 5px;">
                    {% for img in old_images %}
                    <div style="text-align: center; border: 1px solid #eee; padding: 5px; background: #fafafa; border-radius: 4px;">
                        <img src="/media/products/{{ img }}" alt="Product Image" style="width: 80px; height: 80px; object-fit: cover; display: block; margin-bottom: 8px;">
                        <label style="font-size: 12px; cursor: pointer; color: #555;">
                            <input type="checkbox" name="hinhxoa[]" value="{{ img }}" style="cursor: pointer;"> Xóa
                        </label>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <!-- Detail -->
                <textarea name="detail" rows="6" placeholder="Detail" style="margin-bottom: 10px; width: 100%; padding: 10px; border: 1px solid #F0F0E9; background: #F0F0E9; resize: vertical;">{{ product.detail|default:'' }}</textarea>

                <button type="submit" class="btn btn-default" style="background: #FE980F; color: white; margin-top: 10px; padding: 6px 25px;">Save</button>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/jquery.js' %}"></script>
<script>
    // 1. Tự động bật/tắt ô Sale %
    $('#status_select').on('change', function () {
        if ($(this).val() === '1') {
            $('#sale_box').show();
        } else {
            $('#sale_box').hide();
        }
    });

    // 2. Submit form bằng AJAX
    $('#editProductAjax').on('submit', function (e) {
        e.preventDefault();

        // Xóa thông báo lỗi cũ
        $('p[id^="error-"]').text('');

        const formData = new FormData(this);

        $.ajax({
            url: window.location.href,
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function (response) {
                if (response.status === 'success') {
                    // Chuyển hướng về trang My Product sau khi cập nhật thành công
                    window.location.href = "{% url 'my_product' %}";
                }
            },
            error: function (xhr) {
                if (xhr.responseJSON && xhr.responseJSON.errors) {
                    const errors = xhr.responseJSON.errors;
                    if (errors.name) $('#error-name').text(errors.name);
                    if (errors.price) $('#error-price').text(errors.price);
                    if (errors.category) $('#error-category').text(errors.category);
                    if (errors.brand) $('#error-brand').text(errors.brand);
                    if (errors.images) $('#error-images').text(errors.images);
                } else {
                    alert('Đã xảy ra lỗi khi cập nhật, vui lòng thử lại.');
                }
            }
        });
    });
</script>
{% endblock %}
